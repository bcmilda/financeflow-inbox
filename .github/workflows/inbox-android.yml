# FinanceFlow Inbox · sestavení Android appky (APK) při každém pushi.
# Hotové APK najdeš na GitHubu: Actions → poslední běh → Artifacts → financeflow-inbox-apk.
name: Inbox Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04   # má předinstalované Android SDK (ANDROID_HOME)
    defaults:
      run:
        working-directory: inbox-android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Sestavit APK (debug)
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: financeflow-inbox-apk
          path: inbox-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
