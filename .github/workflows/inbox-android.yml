# FinanceFlow Inbox · sestavení Android appky (APK) při každém pushi.
# Hotové APK najdeš na GitHubu: Actions → poslední běh → Artifacts → financeflow-inbox-apk.
name: Inbox Android

on:
  push:
    paths:
      - "inbox-android/**"
      - ".github/workflows/inbox-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inbox-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Sestavit APK (debug)
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: financeflow-inbox-apk
          path: inbox-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
