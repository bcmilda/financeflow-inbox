# FinanceFlow Inbox · sestavení Android appky (APK) při každém pushi.
# Hotové APK najdeš na GitHubu: Actions → poslední běh → Artifacts → financeflow-inbox-apk.
name: Inbox Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # vydání APK ke stažení (Releases)

jobs:
  build:
    runs-on: ubuntu-24.04   # má předinstalované Android SDK (ANDROID_HOME)
    defaults:
      run:
        working-directory: inbox-android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Sestavit APK (debug)
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: financeflow-inbox-apk
          path: inbox-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Vydat APK ke stažení (Releases → nejnovejsi)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk financeflow-inbox.apk
          gh release delete nejnovejsi --yes --cleanup-tag || true
          gh release create nejnovejsi financeflow-inbox.apk --target "$GITHUB_SHA" \
            --title "FinanceFlow Inbox – nejnovější sestavení" \
            --notes "Sestaveno automaticky z commitu $GITHUB_SHA. Debug APK pro instalaci mimo Google Play."
